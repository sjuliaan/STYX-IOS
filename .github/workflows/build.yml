name: Build STYX-iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ldid make xz
          echo "Xcode: $(xcode-select -p)"
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          # NOTE: a submodule's .git is a file, not a directory, on modern git.
          test -e "$HOME/theos/vendor/include/.git" || { echo "vendor submodules missing"; exit 1; }
          test -e "$HOME/theos/vendor/lib/.git" || { echo "vendor submodules missing"; exit 1; }
          test -e "$HOME/theos/vendor/logos/.git" || { echo "vendor submodules missing"; exit 1; }

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          make all FINALPACKAGE=1

      - name: Collect artifact
        run: |
          mkdir -p output
          DYLIB=$(find .theos -name "StyxMenu.dylib" | head -1)
          if [ -z "$DYLIB" ]; then
            echo "StyxMenu.dylib not produced. Tree:"
            find .theos -maxdepth 3 -type d
            exit 1
          fi
          cp "$DYLIB" output/StyxMenu.dylib
          lipo -info output/StyxMenu.dylib
          ls -la output/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: StyxMenu.dylib
          path: output/StyxMenu.dylib
          retention-days: 30
