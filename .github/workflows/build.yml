name: Build STYX-iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ldid dpkg xz
          echo "Xcode: $(xcode-select -p)"
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          make clean
          make package FINALPACKAGE=1

      - name: Collect artifact
        run: |
          mkdir -p output
          DYLIB=$(find .theos/obj -name "*.dylib" | head -1)
          if [ -z "$DYLIB" ]; then
            dpkg -x packages/*.deb extracted
            DYLIB=$(find extracted -name "*.dylib" | head -1)
          fi
          cp "$DYLIB" output/StyxMenu.dylib
          ls -la output/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: StyxMenu.dylib
          path: output/StyxMenu.dylib
          retention-days: 30