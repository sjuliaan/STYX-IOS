name: Build STYX-iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ldid make xz
          echo "Xcode: $(xcode-select -p)"
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          # NOTE: a submodule's .git is a file, not a directory, on modern git.
          test -e "$HOME/theos/vendor/include/.git" || { echo "vendor submodules missing"; exit 1; }
          test -e "$HOME/theos/vendor/lib/.git" || { echo "vendor submodules missing"; exit 1; }
          test -e "$HOME/theos/vendor/logos/.git" || { echo "vendor submodules missing"; exit 1; }

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          make all FINALPACKAGE=1

      - name: Collect artifact
        run: |
          mkdir -p output
          # NOTE: Theos also emits a companion debug bundle at
          #   .theos/obj/arm64/StyxMenu.dylib.dSYM/Contents/Resources/DWARF/StyxMenu.dylib
          # whose inner file has the SAME name but is an MH_DSYM, not a loadable
          # dylib. Exclude .dSYM paths or we will ship a debug symbol file.
          DYLIB=$(find .theos/obj -type f -name "StyxMenu.dylib" -not -path "*.dSYM*" | head -1)
          if [ -z "$DYLIB" ]; then
            echo "StyxMenu.dylib not produced. Tree:"
            find .theos -maxdepth 4
            exit 1
          fi
          cp "$DYLIB" output/StyxMenu.dylib
          echo "Picked: $DYLIB"
          # Assert this is a real MH_DYLIB (filetype 6), not MH_DSYM (10).
          FT=$(python3 -c "import struct;print(struct.unpack('<I',open('output/StyxMenu.dylib','rb').read(16)[12:16])[0])")
          echo "Mach-O filetype = $FT"
          if [ "$FT" != "6" ]; then
            echo "ERROR: artifact is not an MH_DYLIB (got $FT)"
            exit 1
          fi
          lipo -info output/StyxMenu.dylib
          ls -la output/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: StyxMenu.dylib
          path: output/StyxMenu.dylib
          retention-days: 30
